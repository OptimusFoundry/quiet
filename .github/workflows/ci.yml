name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `prepare` would build here too; skip it so the build runs once, as its own step.
      - run: npm ci --ignore-scripts

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:package

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - run: npm run test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
