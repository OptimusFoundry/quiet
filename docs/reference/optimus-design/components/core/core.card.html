<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../../ds-loader.js"></script>
</head><body style="margin:0;padding:24px;background:var(--paper);">
<div id="root"></div>
<script type="text/babel">
loadDS('../../').then(DS => {
const { Button, ArrowLink, Eyebrow, Headline, Tag, StatusDot, Wordmark, Rule } = DS;
const L = ({c}) => <div style={{fontFamily:'var(--font-mono)',fontSize:10,letterSpacing:'.08em',textTransform:'uppercase',color:'var(--muted-2)',width:90}}>{c}</div>;
const Row = ({l, children}) => <div style={{display:'flex',alignItems:'center',gap:16,flexWrap:'wrap'}}><L c={l}/>{children}</div>;
ReactDOM.createRoot(root).render(<div style={{display:'flex',flexDirection:'column',gap:20}}>
  <Row l="Button"><Button arrow>Start a project</Button><Button variant="secondary">Commission a piece</Button><Button variant="ghost" arrow>See the work</Button><Button size="sm" disabled>Disabled</Button></Row>
  <Row l="Headline"><Headline size="h3" lead="Heavy software," accent="quietly made" /></Row>
  <Row l="Eyebrow"><Eyebrow index="01">The studio</Eyebrow><ArrowLink href="#">Read the studio journal</ArrowLink></Row>
  <Row l="Tag · Dot"><Tag>TypeScript</Tag><Tag>Postgres</Tag><Tag tone="ink">Edge</Tag><StatusDot status="live"/><StatusDot status="prototype"/></Row>
  <Rule />
  <Row l="Wordmark"><Wordmark size="nav"/><Wordmark size={22}/></Row>
</div>);
});
</script></body></html>
