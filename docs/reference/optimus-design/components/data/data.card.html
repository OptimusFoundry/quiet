<!-- @dsCard group="Components" viewport="800x420" name="Data" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../../ds-loader.js"></script>
</head><body style="margin:0;padding:24px;background:var(--paper);">
<div id="root"></div>
<script type="text/babel">
loadDS('../../').then(DS => {
const { StatCard, Table, Badge, FilterTabs } = DS;
ReactDOM.createRoot(root).render(<div style={{display:'flex',flexDirection:'column',gap:24}}>
  <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:16}}>
    <StatCard label="MRR" value={48200} format={v=>'$'+Math.round(v).toLocaleString()} delta={12.4} period="vs Sep" />
    <StatCard label="Active seats" value={312} delta={3} />
    <StatCard label="Churn" value="2.1%" delta={-0.3} variant="filled" />
  </div>
  <FilterTabs size="sm" items={[{value:'all',label:'All',count:4},{value:'paid',label:'Paid',count:2},{value:'due',label:'Due',count:2}]} />
  <Table size="sm" columns={[{key:'name',header:'Project',sortable:true},{key:'status',header:'Status',render:r=><Badge size="sm" variant={r.status==='Paid'?'success':r.status==='Failed'?'error':'warning'}>{r.status}</Badge>},{key:'amount',header:'Amount',align:'right',sortable:true,render:r=>'$'+r.amount.toLocaleString()}]}
    data={[{id:1,name:'Anvil',status:'Paid',amount:24000},{id:2,name:'Bellows',status:'Due',amount:18500},{id:3,name:'Cinder',status:'Failed',amount:9200}]} />
</div>);
});
</script></body></html>
