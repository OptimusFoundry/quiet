<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:24px;background:var(--paper);color:var(--ink);font-family:var(--font-sans);display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:32px">
<div><div style="display:grid;grid-template-columns:160px 1fr 140px;gap:16px;align-items:center;padding:10px 0;border-top:1px solid var(--rule-soft)"><span style="font-size:15px">Icon ↔ label</span><span style="height:8px;width:var(--space-inline);background:var(--ink)" data-density="app"></span><span style="font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-size:10px;color:var(--muted)">8</span></div><div style="display:grid;grid-template-columns:160px 1fr 140px;gap:16px;align-items:center;padding:10px 0;border-top:1px solid var(--rule-soft)"><span style="font-size:15px">Inside a card</span><span style="height:8px;width:var(--space-stack);background:var(--ink)" data-density="app"></span><span style="font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-size:10px;color:var(--muted)">16</span></div><div style="display:grid;grid-template-columns:160px 1fr 140px;gap:16px;align-items:center;padding:10px 0;border-top:1px solid var(--rule-soft)"><span style="font-size:15px">Field ↔ field</span><span style="height:8px;width:var(--space-field);background:var(--ink)" data-density="app"></span><span style="font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-size:10px;color:var(--muted)">24</span></div><div style="display:grid;grid-template-columns:160px 1fr 140px;gap:16px;align-items:center;padding:10px 0;border-top:1px solid var(--rule-soft)"><span style="font-size:15px">Card padding</span><span style="height:8px;width:var(--space-card-pad);background:var(--ink)" data-density="app"></span><span style="font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-size:10px;color:var(--muted)">24 app · 32 site</span></div><div style="display:grid;grid-template-columns:160px 1fr 140px;gap:16px;align-items:center;padding:10px 0;border-top:1px solid var(--rule-soft)"><span style="font-size:15px">Card ↔ card</span><span style="height:8px;width:var(--space-card-gap);background:var(--ink)" data-density="app"></span><span style="font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-size:10px;color:var(--muted)">24 app · 32 site</span></div><div style="display:grid;grid-template-columns:160px 1fr 140px;gap:16px;align-items:center;padding:10px 0;border-top:1px solid var(--rule-soft)"><span style="font-size:15px">Block ↔ block</span><span style="height:8px;width:var(--space-block);background:var(--ink)" data-density="app"></span><span style="font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-size:10px;color:var(--muted)">32 app · 64 site</span></div><div style="display:grid;grid-template-columns:160px 1fr 140px;gap:16px;align-items:center;padding:10px 0;border-top:1px solid var(--rule-soft)"><span style="font-size:15px">Section padding</span><span style="height:8px;width:var(--space-section);background:var(--ink)" data-density="app"></span><span style="font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-size:10px;color:var(--muted)">48 app · 128 site</span></div></div>
<div data-density="app" style="border:1px solid var(--rule-soft);padding:var(--space-card-pad);display:flex;flex-direction:column;gap:var(--space-stack);align-self:start">
<span style="font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">Card · app density</span><span style="font:var(--role-card-title)">Anvil for iOS</span><span style="font:var(--role-small);color:var(--muted)">Padding 24 · stack 16 · inline 8</span>
<div style="display:flex;gap:var(--space-inline)"><span style="font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-size:10px;padding:4px 10px;border:1px solid var(--rule-soft);border-radius:999px;color:var(--muted)">Swift</span><span style="font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-size:10px;padding:4px 10px;border:1px solid var(--rule-soft);border-radius:999px;color:var(--muted)">SwiftUI</span></div></div>
</body></html>
