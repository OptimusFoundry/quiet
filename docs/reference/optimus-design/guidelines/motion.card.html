<!-- @dsCard group="Motion" viewport="700x150" name="Durations & easing" subtitle="0.22s eased hovers · seconds for ambient loops" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:24px;background:var(--paper);color:var(--ink);font-family:var(--font-sans);"><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px"><div style="border-top:1px solid var(--ink);padding-top:12px;display:flex;flex-direction:column;gap:6px"><div style="font-weight:700;font-size:32px;letter-spacing:-.04em">0.22s</div><div style="font-weight:600;font-size:14px">Hover</div><div style="font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">--dur-hover</div></div><div style="border-top:1px solid var(--ink);padding-top:12px;display:flex;flex-direction:column;gap:6px"><div style="font-weight:700;font-size:32px;letter-spacing:-.04em">6s</div><div style="font-weight:600;font-size:14px">Forge loop</div><div style="font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">--dur-forge-loop</div></div><div style="border-top:1px solid var(--ink);padding-top:12px;display:flex;flex-direction:column;gap:6px"><div style="font-weight:700;font-size:32px;letter-spacing:-.04em">10s</div><div style="font-weight:600;font-size:14px">Heat pass</div><div style="font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">--dur-heat-pass</div></div><div style="border-top:1px solid var(--ink);padding-top:12px;display:flex;flex-direction:column;gap:6px"><div style="font-weight:700;font-size:32px;letter-spacing:-.04em">ease-out</div><div style="font-weight:600;font-size:14px">Soft, never bounce</div><div style="font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">--ease-soft</div></div></div></body></html>
