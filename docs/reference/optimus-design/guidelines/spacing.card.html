mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)">--space-6</div><div style="height:12px;width:120px;background:var(--ink)"></div><div style="font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">48px</div></div><div style="display:grid;grid-template-columns:100px 1fr 60px;align-items:center;gap:16px"><div style="font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)">--space-8</div><div style="height:12px;width:160px;background:var(--ink)"></div><div style="font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">64px</div></div><div style="display:grid;grid-template-columns:100px 1fr 60px;align-items:center;gap:16px"><div style="font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)">--space-12</div><div style="height:12px;width:240px;background:var(--ink)"></div><div style="font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">96px</div></div><div style="display:grid;grid-template-columns:100px 1fr 60px;align-items:center;gap:16px"><div style="font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)">--space-16</div><div style="height:12px;width:320px;background:var(--ink)"></div><div style="font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">128px</div></div></div></body></html>
