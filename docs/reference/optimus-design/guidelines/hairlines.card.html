<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:24px;background:var(--paper);color:var(--ink);font-family:var(--font-sans);"><div style="display:flex;flex-direction:column"><div style="border-top:1px solid var(--ink);padding:16px 0;display:flex;justify-content:space-between"><span style="font-weight:600">Section rule</span><div style="font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">1px · --ink</div></div><div style="border-top:1px solid var(--rule-soft);padding:16px 0;display:flex;justify-content:space-between"><span style="font-weight:600">List divider</span><div style="font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">1px · --rule-soft</div></div><div style="border-top:1px solid var(--rule-soft);padding:16px 0;background:var(--paper-2);display:flex;justify-content:space-between;padding-left:16px;padding-right:16px"><span style="font-weight:600">Alt section</span><div style="font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">--paper-2 between rules</div></div></div></body></html>
