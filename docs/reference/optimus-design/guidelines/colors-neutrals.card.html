<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:24px;background:var(--paper);color:var(--ink);font-family:var(--font-sans);"><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px"><div style="display:flex;flex-direction:column;gap:8px;min-width:0"><div style="height:72px;border-radius:var(--radius-lg);background:var(--paper);border:1px solid var(--rule-soft);"></div><div style="font-weight:600;font-size:14px">--paper</div><div style="font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">#FFFFFF · Page ground</div></div><div style="display:flex;flex-direction:column;gap:8px;min-width:0"><div style="height:72px;border-radius:var(--radius-lg);background:var(--paper-2);"></div><div style="font-weight:600;font-size:14px">--paper-2</div><div style="font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">#F6F6F7 · Alt sections</div></div><div style="display:flex;flex-direction:column;gap:8px;min-width:0"><div style="height:72px;border-radius:var(--radius-lg);background:var(--rule-soft);"></div><div style="font-weight:600;font-size:14px">--rule-soft</div><div style="font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">#EAEAED · Hairlines</div></div></div></body></html>
