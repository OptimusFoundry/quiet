<!-- @dsCard group="Motion" viewport="700x150" name="Heat pass" subtitle="Molten fills the rail, each step heats and holds" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:24px;background:var(--paper);color:var(--ink);font-family:var(--font-sans);"><style>@keyframes heat{0%{width:0}80%{width:100%}100%{width:100%}} @media (prefers-reduced-motion:reduce){#r{animation:none!important;width:100%!important}}</style><div style="position:relative;height:2px;background:var(--rule-soft);margin-top:12px"><div id="r" style="position:absolute;inset:0 auto 0 0;background:var(--molten);animation:heat 10s linear infinite"></div></div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:20px"><div><div style="font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">i</div><div style="font-weight:600;font-size:20px;letter-spacing:-.02em;margin-top:4px">Brief</div></div><div><div style="font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">ii</div><div style="font-weight:600;font-size:20px;letter-spacing:-.02em;margin-top:4px">Cast</div></div><div><div style="font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">iii</div><div style="font-weight:600;font-size:20px;letter-spacing:-.02em;margin-top:4px">Temper</div></div><div><div style="font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">iv</div><div style="font-weight:600;font-size:20px;letter-spacing:-.02em;margin-top:4px">Stamp</div></div></div></body></html>
