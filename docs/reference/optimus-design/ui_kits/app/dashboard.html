<!-- @dsCard group="App" viewport="1280x860" name="Dashboard" subtitle="Sidebar + 12-col blocks · app density" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Optimus Foundry — Dashboard</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../../ds-loader.js"></script>
</head><body style="margin:0;overflow:hidden">
<div id="root"></div>
<script type="text/babel" src="AppShell.jsx"></script>
<script type="text/babel">
const BUILDS = [
  { id: 1, project: 'Anvil', build: '#214', status: 'Live', when: '06:12', dur: '4m 10s' },
  { id: 2, project: 'Bellows', build: '#88', status: 'Live', when: '04:40', dur: '7m 02s' },
  { id: 3, project: 'Cinder', build: '#31', status: 'Failed', when: '03:15', dur: '1m 48s' },
  { id: 4, project: 'Plinth', build: '#9', status: 'Queued', when: '02:58', dur: '\u2014' },
  { id: 5, project: 'Quench', build: '#140', status: 'Live', when: 'Yesterday', dur: '5m 30s' },
];
function Page() {
  React.useEffect(() => { setTimeout(() => {
    const A = window.DS.ArrowLink, N = window.appNotify;
    if (!N) return;
    N({ read: true, variant: 'success', title: 'Invoice 0032 paid.', description: '$24,000 from Arbor.', at: 'Mon' });
    N({ read: true, title: 'Linus invited Grace.', description: 'Role: Editor', at: 'Mon' });
    N({ variant: 'error', title: 'Cinder #31 failed.', description: 'Migration 0042 refused.', action: <A href="list-detail.html">View log</A>, at: '03:15' });
    N({ variant: 'warning', title: 'Invoice 0031 is 9 days overdue.', action: <A href="settings.html#billing">Open billing</A>, at: '05:00' });
    N({ variant: 'success', title: 'Anvil #214 is live.', at: '06:12' });
  }, 300); }, []);
  const { PageHero, Alert, ArrowLink, Button, Grid, Col, StatCard, SectionHeader, Table, Badge, List, Avatar } = window.DS;
  return (
    <AppShell active="dashboard" crumbs={[{ label: 'Workspace', href: '#' }, { label: 'Overview' }]}>
      <PageHero size="md" ruled={false} style={{ padding: 0 }} title="Good morning," accent="Ada" description="Three builds shipped overnight. One failed, and one invoice is overdue."
        actions={<><Button size="sm" arrow>New project</Button><Button size="sm" variant="secondary" onClick={() => window.appToast?.({ variant: 'success', title: 'Invite sent.', meta: 'grace@optimusfoundry.com' })}>Invite</Button></>} />
      <Alert variant="warning" title="Invoice 0031 is 9 days overdue." action={<ArrowLink href="settings.html#billing">Open billing</ArrowLink>}>Northwind owes $18,500. We sent two reminders.</Alert>
      <Grid columns={12} gap="var(--grid-gutter)">
        <Col span={3}><StatCard label="MRR" value={48200} format={v => '$' + Math.round(v).toLocaleString('en-US')} delta={12.4} period="vs Sep" animate /></Col>
        <Col span={3}><StatCard label="Active seats" value={312} delta={3.1} period="vs Sep" /></Col>
        <Col span={3}><StatCard label="Builds · 7d" value={86} delta={-4} period="vs prior week" /></Col>
        <Col span={3}><StatCard label="Uptime" value="99.98%" trend="neutral" delta="0.00%" period="30 days" /></Col>
      </Grid>
      <Grid columns={12} gap="var(--grid-gutter)">
        <Col span={8} style={{ display: 'flex', flexDirection: 'column', gap: 'var(--space-stack)' }}>
          <SectionHeader size="sm" as="h2" title="Recent" accent="builds" actions={<ArrowLink href="list-detail.html">All builds</ArrowLink>} />
          <Table size="sm" columns={[
            { key: 'project', header: 'Project', sortable: true },
            { key: 'build', header: 'Build' },
            { key: 'status', header: 'Status', render: r => <Badge size="sm" variant={r.status === 'Live' ? 'success' : r.status === 'Failed' ? 'error' : 'secondary'}>{r.status}</Badge> },
            { key: 'dur', header: 'Duration', align: 'right' },
            { key: 'when', header: 'Started', align: 'right' },
          ]} data={BUILDS} onRowClick={() => (location.href = 'list-detail.html')} />
        </Col>
        <Col span={4} style={{ display: 'flex', flexDirection: 'column', gap: 'var(--space-stack)' }}>
          <SectionHeader size="sm" as="h2" title="Activity" />
          <List size="sm" items={[
            { primary: 'Ada shipped Anvil #214', secondary: 'Swift 6 migration', leading: <Avatar name="Ada Lovelace" size="sm" />, trailing: '06:12' },
            { primary: 'Cinder #31 failed', secondary: 'Migration 0042 refused', leading: <Avatar name="CI" size="sm" shape="square" />, trailing: '03:15' },
            { primary: 'Linus invited Grace', secondary: 'Role: Editor', leading: <Avatar name="Linus T" size="sm" />, trailing: 'Mon' },
            { primary: 'Invoice 0032 paid', secondary: '$24,000 \u00b7 Arbor', leading: <Avatar name="$" size="sm" shape="square" />, trailing: 'Mon' },
          ]} />
        </Col>
      </Grid>
    </AppShell>
  );
}
loadDS('../../').then(d => { window.DS = d; ReactDOM.createRoot(document.getElementById('root')).render(<Page />); });
</script>
</body></html>
